name: Sync newsletter issues from Substack

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-newsletter
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild issue cards from the RSS feed
        run: python scripts/sync_substack.py

      - name: Commit if the feed changed
        run: |
          if git diff --quiet -- newsletter.html; then
            echo "No new issues."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter.html
          git commit -m "Sync newsletter issues from Substack RSS"
          git push
