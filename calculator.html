  function exclusion(prefix, label, aId, bId, aName, bName) {

    const a = parseDate(val(aId)), b = parseDate(val(bId));

    } else {
      badge.textContent = 'Within time'; badge.className = 'result-badge ok';

    lastSummary = `Limitation Act 1908, ${artLabel} — ${desc}\n` +
      `Trigger: ${fmt(trigger)} | Period: ${periodStr(y, mo, d)}` +
      (s12.days ? ` | s.12: +${s12.days}d` : '') + (s14.days ? ` | s.14: +${s14.days}d` : '') +
      `\nLast day to file: ${fmtDay(deadline)} (${remaining < 0 ? 'expired' : plural(remaining) + ' left'} as of ${fmt(ref)})`;

    onArticleChange();
    document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  /* ── 4. Table: keyboard access, broader search ───────────────────────────── */
  const baseRender = window.renderTable;
  window.renderTable = function () {
    // Render everything (division filter still applies), then narrow by search incl. "time begins" text.
    const q = searchQuery.trim().toLowerCase();
    const keep = searchQuery;
    searchQuery = '';
    baseRender();
    searchQuery = keep;
    const tbody = document.getElementById('tableBody');
    let n = 0;
    tbody.querySelectorAll('tr[data-art]').forEach(tr => {
      const a = ARTICLES.find(x => x[0] === tr.dataset.art);
      const hit = !q || a[1].toLowerCase().includes(q) || String(a[0]).includes(q) || a[6].toLowerCase().includes(q);
      if (!hit) { tr.remove(); return; }
      n++;
      tr.tabIndex = 0;
      tr.setAttribute('role', 'button');
      tr.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tr.click(); }
      });
    });
    if (!n) tbody.innerHTML = '<tr><td colspan="5" class="no-results">No articles match. Try a keyword like \u201cmortgage\u201d or an article number.</td></tr>';
    document.getElementById('tableCount').textContent = `${n} of ${ARTICLES.length} articles`;
  };
  window.renderTable();

  /* ── 5. Honest stats + accessibility cleanup ─────────────────────────────── */
  const stat = document.querySelector('.masthead-stat-n');
  if (stat) { stat.textContent = ARTICLES.length; stat.nextElementSibling.textContent = 'In-force entries'; }
  const disc = document.querySelector('.disclaimer');
  if (disc) disc.setAttribute('role', 'note');                 // role=alert interrupted screen readers on load
  const mast = document.querySelector('.masthead');
  if (mast) mast.removeAttribute('role');                      // banner role is invalid inside <main>
  const prog = document.getElementById('scroll-progress');
  if (prog) { prog.removeAttribute('role'); prog.setAttribute('aria-hidden', 'true'); }
  document.querySelectorAll('.field-label:not([for])').forEach(l => (l.tagName === 'LABEL') && l.replaceWith(Object.assign(document.createElement('span'), { className: l.className, textContent: l.textContent })));
  const ref = document.getElementById('refDate');
  if (ref && !ref.value) ref.value = toISO(new Date());
})();
